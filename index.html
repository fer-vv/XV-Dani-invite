<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XV Años · Daniela Bastien Villaseñor</title>
<meta name="theme-color" content="#e4d4f4">
<meta property="og:title" content="Mis XV Años · Daniela">
<meta property="og:description" content="Estás invitado a celebrar conmigo. Domingo 6 de diciembre.">
<meta property="og:image" content="https://fer-vv.github.io/XV-Dani-invite/og.jpg">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400&family=Cormorant+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:linear-gradient(160deg,#f3ebfa,#e0cff2 55%,#cdb4e6); }
  #visor { display:flex; height:100dvh; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory;
           scrollbar-width:none; overscroll-behavior-x:contain; }
  #visor::-webkit-scrollbar { display:none; }
  .slide { flex:0 0 100vw; height:100dvh; scroll-snap-align:center; scroll-snap-stop:always; display:flex; align-items:center; justify-content:center; }
  .card { position:relative; container-type:inline-size; aspect-ratio:5/7;
          width:min(100vw, calc(100dvh * 5 / 7)); box-shadow:0 10px 40px rgba(80,50,120,.28); }
  .card img { display:block; width:100%; height:100%; user-select:none; -webkit-user-drag:none; }
  .hs { position:absolute; display:block; border-radius:999px; }
  .hs.sig { left:22%; width:56%; }

  /* Contador en vivo (diapositiva 3) */
  .cuenta { position:absolute; left:20.5%; top:32.4%; width:59%; height:10.4%; display:flex; align-items:flex-start; justify-content:space-between;
            color:#573e6d; pointer-events:none; }
  .cuenta .u { text-align:center; flex:1; }
  .cuenta b { display:block; font-family:'Bodoni Moda',serif; font-weight:400; font-size:9.6cqw; line-height:1; }
  .cuenta i { display:block; font-style:normal; font-family:'Cormorant SC',serif; font-weight:600; font-size:2.2cqw; letter-spacing:.06em; margin-top:1.4cqw; color:#6b4f90; }
  .cuenta .p { font-family:'Bodoni Moda',serif; font-size:8cqw; line-height:1; padding-top:.6cqw; }

  /* Sobre: indicación */
  .abrir { position:absolute; left:50%; bottom:7%; transform:translateX(-50%); padding:2.4cqw 5cqw; border-radius:999px;
           font-family:'Cormorant SC',serif; font-weight:600; font-size:3.6cqw; letter-spacing:.14em; color:#5f3f8c;
           background:rgba(255,255,255,.8); border:1px solid #c9ab72; animation:late 2.2s ease-in-out infinite; pointer-events:none; }
  @keyframes late { 50% { transform:translateX(-50%) scale(1.06); } }

  /* Navegación */
  #puntos { position:fixed; left:0; right:0; bottom:max(10px, env(safe-area-inset-bottom)); display:flex; justify-content:center; gap:8px; z-index:5; pointer-events:none; }
  #puntos span { width:8px; height:8px; border-radius:50%; background:rgba(95,63,140,.3); transition:.25s; }
  #puntos span.on { background:#7e5cab; width:22px; border-radius:6px; }
  .flecha { position:fixed; top:50%; transform:translateY(-50%); z-index:5; width:46px; height:46px; border-radius:50%; border:1px solid #c9ab72;
            background:rgba(255,255,255,.85); color:#5f3f8c; font-size:26px; cursor:pointer; display:none; }
  #ant { left:16px; } #sig { right:16px; }
  @media (hover:hover) and (min-width:700px) { .flecha { display:block; } }
</style>
</head>
<body>

<div id="visor">
  <!-- 1: sobre -->
  <section class="slide"><div class="card" data-ir="1">
    <img src="slide1.webp" alt="Invitación: sobre cerrado" loading="eager">
    <div class="abrir">Toca para abrir</div>
  </div></section>

  <!-- 2: portada -->
  <section class="slide"><div class="card">
    <img src="slide2.webp" alt="XV años de Daniela Bastien Villaseñor. Domingo 6 de diciembre. Misa 5:30 p. m., celebración 7:00 p. m." loading="eager">
    <a class="hs sig" style="top:86%;height:9%" data-ir="2" aria-label="Ver detalles"></a>
  </div></section>

  <!-- 3: contador, misa y celebración -->
  <section class="slide"><div class="card">
    <img src="slide3.webp" alt="Cuenta regresiva, misa y celebración en Salón Bambú" loading="lazy">
    <div class="cuenta" id="cuenta"></div>
    <!-- Mapa de la misa (EDITA el texto de la búsqueda si hace falta) -->
    <a class="hs" style="left:36.9%;top:57.1%;width:27.9%;height:5.4%" target="_blank" rel="noopener" aria-label="Ver ubicación de la misa"
       href="https://www.google.com/maps/place/Rector%C3%ADa+de+Nuestra+Se%C3%B1ora+de+Guadalupe+Reina+de+M%C3%A9xico/@19.6685338,-101.2076372,720m/data=!3m1!1e3!4m10!1m2!2m1!1sRector%C3%ADa+de+Nuestra+Se%C3%B1ora+de+Guadalupe+Reina+de+M%C3%A9xico+Morelia!3m6!1s0x842d0db58ddea10b:0xc1df5e9b50149ab1!8m2!3d19.6685338!4d-101.2031311!15sCkJSZWN0b3LDrWEgZGUgTnVlc3RyYSBTZcOxb3JhIGRlIEd1YWRhbHVwZSBSZWluYSBkZSBNw6l4aWNvIE1vcmVsaWGSAQ9jYXRob2xpY19jaHVyY2jgAQA!16s%2Fg%2F11b7k43j35?entry=ttu&g_ep=EgoyMDI2MTEwMy4wIKXMDSoASAFQAw%3D%3D"></a>
    <!-- Mapa del salón Bambú -->
    <a class="hs" style="left:36.1%;top:74.8%;width:27.8%;height:5.3%" target="_blank" rel="noopener" aria-label="Ver ubicación del salón"
       href="https://www.google.com.mx/maps/place/Bamb%C3%BA/@19.6895382,-101.1705014,17z/data=!3m1!4b1!4m6!3m5!1s0x842d0dfc03ed97cf:0x93943f811014af1d!8m2!3d19.6895382!4d-101.1679265!16s%2Fg%2F11cm16bx8s?entry=ttu&g_ep=EgoyMDI2MTAyOC4wIKXMDSoASAFQAw%3D%3D"></a>
    <a class="hs sig" style="top:83.5%;height:9%" data-ir="3" aria-label="Siguiente"></a>
  </div></section>

  <!-- 4: vestimenta y confirmación -->
  <section class="slide"><div class="card">
    <img src="slide4.webp" alt="Vestimenta formal y confirmación de asistencia antes del 30 de noviembre" loading="lazy">
    <a class="hs" id="confirmar" style="left:33.7%;top:58.9%;width:31.3%;height:6%" target="_blank" rel="noopener" aria-label="Confirmar por WhatsApp"></a>
    <a class="hs sig" style="top:83.5%;height:9%" data-ir="4" aria-label="Siguiente"></a>
  </div></section>

  <!-- 5: mesa de regalos / cierre -->
  <section class="slide"><div class="card">
    <img src="slide5.webp" alt="Mensaje final" loading="lazy">
  </div></section>
</div>

<button class="flecha" id="ant" aria-label="Anterior">‹</button>
<button class="flecha" id="sig" aria-label="Siguiente">›</button>
<div id="puntos"></div>

<script>
  // ===== EDITA ESTOS DATOS =====
  const FECHA_EVENTO = new Date("2026-12-06T17:30:00-06:00"); // hora de la misa
  const WHATSAPP = "524431234567"; // lada país + número, sin + ni espacios
  const MENSAJE = "¡Hola! Confirmo mi asistencia a los XV años de Daniela.";
  // =============================

  document.getElementById("confirmar").href = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(MENSAJE);

  const visor = document.getElementById("visor");
  const slides = [...visor.querySelectorAll(".slide")];
  const puntos = document.getElementById("puntos");
  slides.forEach(() => puntos.appendChild(document.createElement("span")));
  const ir = i => visor.scrollTo({ left: Math.max(0, Math.min(i, slides.length - 1)) * visor.clientWidth, behavior: "smooth" });
  const actual = () => Math.round(visor.scrollLeft / visor.clientWidth);
  const marcar = () => [...puntos.children].forEach((p, i) => p.classList.toggle("on", i === actual()));
  visor.addEventListener("scroll", marcar, { passive: true }); marcar();

  document.querySelectorAll("[data-ir]").forEach(el => el.addEventListener("click", () => ir(+el.dataset.ir)));
  document.getElementById("ant").onclick = () => ir(actual() - 1);
  document.getElementById("sig").onclick = () => ir(actual() + 1);
  addEventListener("keydown", e => { if (e.key === "ArrowRight") ir(actual() + 1); if (e.key === "ArrowLeft") ir(actual() - 1); });

  // Cuenta regresiva en vivo
  function tic() {
    const dif = Math.max(0, FECHA_EVENTO - new Date());
    const v = [Math.floor(dif / 864e5), Math.floor(dif / 36e5) % 24, Math.floor(dif / 6e4) % 60, Math.floor(dif / 1e3) % 60];
    const t = ["DÍAS", "HORAS", "MINUTOS", "SEGUNDOS"];
    document.getElementById("cuenta").innerHTML = v.map((n, i) =>
      (i ? '<div class="p">:</div>' : "") + '<div class="u"><b>' + String(n).padStart(2, "0") + "</b><i>" + t[i] + "</i></div>").join("");
  }
  tic(); setInterval(tic, 1000);
</script>
</body>
</html>
